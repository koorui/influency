services:
  mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: impact
      MYSQL_USER: impact
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["127.0.0.1:13307:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  migrate:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: mysql+pymysql://impact:${MYSQL_PASSWORD}@mysql:3306/impact?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      STORAGE_DIR: /data/materials
      EVALUATION_ADAPTER: ${EVALUATION_ADAPTER:-mock}
      ALLOWED_ORIGIN: ${DEPLOY_ORIGIN:-http://localhost:18080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      mysql: {condition: service_healthy}
    command: ["alembic", "upgrade", "head"]
  api:
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes: ["materials:/data/materials", "./skills:/skills:ro"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
  worker:
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes: ["materials:/data/materials", "./skills:/skills:ro"]
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
  web:
    build: ./frontend
    ports: ["127.0.0.1:18080:80"]
    depends_on: [api]
    restart: unless-stopped
  pipeline-worker:
    build: ./backend
    environment:
      <<: *backend-env
      V19_API_KEY: ${V19_API_KEY:-}
      V19_BASE_URL: ${V19_BASE_URL:-}
      V19_MODEL: ${V19_MODEL:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes: ["materials:/data/materials", "./skills:/skills:ro"]
    command: ["python", "-m", "app.pipeline_worker"]
    restart: unless-stopped
volumes:
  mysql_data:
  materials:
